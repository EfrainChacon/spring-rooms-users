spring:
  application:
    name: users-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/users}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo gobierna Flyway; Hibernate solo comprueba que el mapeo encaja
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Sin baseline-on-migrate: con una BD ya poblada marcaría la V1 como aplicada sin ejecutarla.
  cloud:
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
            logger-level: basic

external:
  service:
    url: ${EXTERNAL_SERVICE_URL:http://localhost:1080}

app:
  users:
    # Sala en la que el servidor da de alta y busca usuarios (el enunciado fija la sala 1).
    # Si no existe en la BD, la aplicación no arranca.
    default-room-id: ${DEFAULT_ROOM_ID:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
